services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestione-operatori-cantieri
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 512M # Limite ideale per VPS Hostinger (evita saturazione della RAM)
          cpus: '1.5'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
