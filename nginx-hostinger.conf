# Configurazione Nginx per VPS Hostinger (Ubuntu / Debian)
# Posiziona questo file in /etc/nginx/sites-available/gestione-operatori
# e crea il symlink in /etc/nginx/sites-enabled/

# Blocco limitazione richieste per proteggere la VPS da attacchi brute-force o DoS
limit_req_zone $binary_remote_addr zone=app_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tuodominio.it www.tuodominio.it; # Modifica con il tuo dominio o IP Hostinger

    # Reindirizzamento HTTPS automatico (attivo dopo aver installato Certbot)
    # return 301 https://$host$request_uri;

    # Compressione Gzip per massimizzare la velocitÃ  su VPS
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Header di sicurezza
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Dimensioni massime consentite per upload
    client_max_body_size 25M;

    # Cache aggressiva per gli asset statici compilati con hash univoco da Vite
    location ~* ^/assets/.*\.(?:js|css|woff2?|eot|ttf|otf|svg|png|jpe?g|webp|gif|ico)$ {
        proxy_pass http://127.0.0.1:3321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Endpoint di Health Check per il monitoraggio della VPS
    location /health {
        proxy_pass http://127.0.0.1:3321/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Proxy verso il server Node.js / Docker
    location / {
        limit_req zone=app_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3321;
        proxy_http_version 1.1;

        # Supporto WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Header per il client reale
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
